<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6f9f">
<title>OSHI CAL</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff7fa;color:#222}
header{background:linear-gradient(135deg,#ff6f9f,#ff9bbb);color:#fff;padding:calc(24px + env(safe-area-inset-top)) 20px 24px;border-radius:0 0 28px 28px}
header h1{margin:0;font-size:29px} header p{margin:6px 0 0;opacity:.92}
main{max-width:620px;margin:auto;padding:18px 16px 40px}
.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 6px 20px rgba(70,30,50,.07)}
.next{text-align:center;background:linear-gradient(135deg,#fff0f5,#fff)}
.days{font-size:46px;font-weight:800;color:#ff4f8a;line-height:1}
h2{font-size:18px;margin:0 0 12px}
input,select{width:100%;padding:13px;margin:5px 0 10px;border:1px solid #e7dce1;border-radius:12px;font-size:16px;background:#fff}
button{width:100%;border:0;padding:13px;border-radius:13px;font-size:15px;font-weight:700}
.primary{background:#ff5f94;color:#fff}
.event{padding:14px 0;border-bottom:1px solid #f0e7eb}
.event:last-child{border-bottom:0}
.event-title{font-weight:750;font-size:16px}
.event-date{color:#e9437b;font-size:14px;margin-top:5px}
.badge{display:inline-block;background:#ffe5ee;color:#d93670;font-size:12px;padding:5px 9px;border-radius:20px;margin-top:7px}
.delete{margin-top:9px;background:#f6f3f4;color:#777;padding:8px}
.empty{text-align:center;color:#999;padding:16px}
.oshi{margin:12px 0 0;color:#555}
.small{font-size:12px;color:#999;margin-top:10px}
</style>
</head>
<body>
<header>
<h1>♡ OSHI CAL</h1>
<p>推しの予定を、ひとつの場所に。</p>
</header>

<main>
<section class="card next">
<h2>次の予定まで</h2>
<div><span class="days" id="countdown">--</span> 日</div>
<p id="nextEventName">予定を登録してください</p>
</section>

<section class="card">
<h2>❤️ 推しを登録</h2>
<input id="oshiName" type="text" placeholder="例：〇〇">
<select id="oshiCategory">
<option>アーティスト</option><option>アイドル</option><option>俳優</option>
<option>声優</option><option>スポーツ選手</option><option>その他</option>
</select>
<input id="oshiUrl" type="url" placeholder="公式サイトURL（任意）">
<button class="primary" onclick="saveOshi()">推しを登録</button>
<div class="oshi" id="oshiDisplay"></div>
</section>

<section class="card">
<h2>📅 イベントを追加</h2>
<input id="eventName" type="text" placeholder="イベント名">
<input id="eventDate" type="date">
<input id="eventTime" type="time">
<input id="eventPlace" type="text" placeholder="場所（任意）">
<select id="eventType">
<option>🎤 ライブ</option><option>🎫 チケット</option><option>📺 テレビ</option>
<option>💿 発売日</option><option>🎬 映画・舞台</option><option>📱 配信</option>
<option>🛍 グッズ</option><option>📌 その他</option>
</select>
<button class="primary" onclick="addEvent()">イベントを追加</button>
</section>

<section class="card">
<h2>✨ これからの予定</h2>
<div id="eventList"></div>
</section>
</main>

<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
let events=JSON.parse(localStorage.getItem("oshiEvents")||"[]");

function saveOshi(){
 const name=document.getElementById("oshiName").value.trim();
 const category=document.getElementById("oshiCategory").value;
 const url=document.getElementById("oshiUrl").value.trim();
 if(!name){alert("推しの名前を入力してください");return}
 localStorage.setItem("oshi",JSON.stringify({name,category,url}));
 showOshi();
}
function showOshi(){
 const o=JSON.parse(localStorage.getItem("oshi")||"null");
 const el=document.getElementById("oshiDisplay");
 if(!o){el.textContent="";return}
 el.innerHTML=`登録中：❤️ <b>${esc(o.name)}</b>（${esc(o.category)}）`+
 (o.url?`<div class="small"><a href="${esc(o.url)}" target="_blank" rel="noopener">公式サイトを開く</a></div>`:"");
}
function addEvent(){
 const name=document.getElementById("eventName").value.trim();
 const date=document.getElementById("eventDate").value;
 const time=document.getElementById("eventTime").value;
 const place=document.getElementById("eventPlace").value.trim();
 const type=document.getElementById("eventType").value;
 if(!name||!date){alert("イベント名と日付を入力してください");return}
 events.push({id:Date.now(),name,date,time,place,type});
 events.sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
 saveEvents();
 ["eventName","eventDate","eventTime","eventPlace"].forEach(id=>document.getElementById(id).value="");
}
function deleteEvent(id){
 if(!confirm("この予定を削除しますか？"))return;
 events=events.filter(e=>e.id!==id); saveEvents();
}
function saveEvents(){
 localStorage.setItem("oshiEvents",JSON.stringify(events)); displayEvents(); updateCountdown();
}
function upcoming(){
 const today=new Date(); today.setHours(0,0,0,0);
 return events.filter(e=>new Date(e.date+"T00:00:00")>=today)
 .sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
}
function displayEvents(){
 const list=document.getElementById("eventList"), arr=upcoming();
 if(!arr.length){list.innerHTML='<div class="empty">まだ予定がありません</div>';return}
 list.innerHTML=arr.map(e=>`<div class="event">
 <div class="event-title">${esc(e.name)}</div>
 <div class="event-date">${esc(e.date)} ${esc(e.time)}${e.place?" ・ "+esc(e.place):""}</div>
 <span class="badge">${esc(e.type)}</span>
 <button class="delete" onclick="deleteEvent(${Number(e.id)})">削除</button>
 </div>`).join("");
}
function updateCountdown(){
 const arr=upcoming(), c=document.getElementById("countdown"), n=document.getElementById("nextEventName");
 if(!arr.length){c.textContent="--";n.textContent="予定を登録してください";return}
 const today=new Date(); today.setHours(0,0,0,0);
 const target=new Date(arr[0].date+"T00:00:00");
 c.textContent=Math.round((target-today)/86400000);
 n.textContent=arr[0].name;
}
showOshi(); displayEvents(); updateCountdown();
</script>
</body>
</html>
